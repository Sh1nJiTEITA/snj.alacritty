[window]
# Removes all window decorations (titlebar, borders)
decorations = "None"
opacity = 1
# opacity = 0.5

[window.padding]
x = 0
y = 0

[scrolling]
history = 4000

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = "Block"

[colors.primary]
background = "#0e0e0e"
foreground = "#e0def4"

[colors.cursor]
cursor = "#524f67"
text = "#e0def4"

[colors.selection]
background = "#403d52"
text = "#e0def4"

[colors.normal]
black   = "#26233a"
red     = "#eb6f92"
green   = "#31748f"
yellow  = "#f6c177"
blue    = "#9ccfd8"
magenta = "#c4a7e7"
cyan    = "#ebbcba"
white   = "#e0def4"

[colors.bright]
black   = "#6e6a86"
red     = "#eb6f92"
green   = "#31748f"
yellow  = "#f6c177"
blue    = "#9ccfd8"
magenta = "#c4a7e7"
cyan    = "#ebbcba"
white   = "#e0def4"
